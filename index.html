<!DOCTYPE html>

<head>
    <title>Digital Detective Board</title>
    <link rel="stylesheet" href="styles.css">
</head>

<html>
<body>
    <script src="interactjsFiles/interact.js"></script>
    <script type="module" src="main-code.js"></script>

    <div class="sideBar">
        <input aria-hidden="true" type="file" id="uploadedImage" accept="image/*" style="display: none;">
        <input aria-hidden="true" type="file" id="loadedBoard" accept=".board" style="display: none;">
        <a aria-hidden="true" id="downloadLink" style="display: none;"></a>
        <button class="sideButton" id="createNoteButton" tabindex="0" title="Create a new note"><img class="icon" src="Resources/plus-square.svg" draggable="false"></button>
        <button class="sideButton" id="uploadImageButton" tabindex="0" title="Upload an image"><img class="icon" src="Resources/upload.svg" draggable="false"></button>
        <button class="sideButton" id="saveButton" tabindex="0" title="Save your corkboard"><img class="icon" src="Resources/floppy.svg" draggable="false"></button>
        <button class="sideButton" id="loadButton" tabindex="0" title="Load a board file"><img class="icon" src="Resources/box-arrow-in-down.svg" draggable="false"></button>
        <button class="sideButton" id="clearButton" tabindex="0" title="Clear the corkboard"><img class="icon" src="Resources/x-lg.svg" draggable="false"></button>
        <button class="sideButton" id="cutButtonID" tabindex="0" title="Toggle the string cutting tool"><img class="icon" src="Resources/scissors.svg" draggable="false"></button>
    </div>
    <div id="viewport">
        <div id="zoomSpace">
            <div id="corkboard" class="corkdrag">
                <svg id="string"></svg>
            </div>
        </div>
    </div>
    <dialog id="modalOverlay" class="hidden">
        <span id="editNoteBox" role="dialog" aria-label="Edit note window" aria-modal="true">
            <div class="modalTextSection">
                <label class="modalTextLabel" for="modalTextInput">Edit Note Text</label>
                <textarea id="modalTextInput"></textarea>
            </div>
            <div class="modalColourSection">
                <label class="modalColourSelectorLabel" for="modalColourSelector">Select Note Colour</label>
                <div class="modalColourPicker" id="modalColourSelector">
                    <input type="radio" id="noteYellow" name="noteColour" value="#fff200" checked>
                    <input type="radio" id="noteBlue" name="noteColour" value="#00ffff">
                    <input type="radio" id="noteRed" name="noteColour" value="#ff8080">
                    <input type="radio" id="noteGreen" name="noteColour" value="#6be16b">
                    <input type="radio" id="notePink" name="noteColour" value="#ffc0cb">
                    <input type="radio" id="noteWhite" name="noteColour" value="#ffffff">
                </div>
            </div>
            <div>
                <button class="modalButton" id="cancelNoteEditButton"><img class="icon" src="Resources/x-lg.svg"></button>
                <button class="modalButton" id="applyNoteEditButton"><img class="icon" src="Resources/check.svg"></button>
            </div>
        </span>
    </dialog>
    <dialog id="clearConfirmation" class="hidden">
        <span id="confirmationNoteBox" role="dialog" aria-label="Clear board confirmation window" aria-modal="true">
            <div class="clearBoardConfirmationSection">
                <label class="confirmClearLabel" for="confirmClear">Are you sure you want to clear the board?</label>
                <div id="confirmClear">
                    <button class="modalButton" id="cancelClear"><img class="icon" src="Resources/x-lg.svg"></button>
                    <button class="modalButton" id="acceptClear"><img class="icon" src="Resources/check.svg"></button>
                </div>
            </div>
        </span>
    </dialog>
</body>
</html>
