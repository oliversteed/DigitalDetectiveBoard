<!DOCTYPE html>

<head>
    <title>Digital Detective Board</title>
    <link rel="stylesheet" href="styles.css">
</head>

<html>
<body>
    <script src="interactjsFiles/interact.js"></script>
    <script type="module" src="main-code.js"></script>

    <div class="sideBar">
        <input aria-hidden="true" type="file" id="uploadedImage" accept="image/*" style="display: none;">
        <input aria-hidden="true" type="file" id="loadedBoard" accept=".board" style="display: none;">
        <a aria-hidden="true" id="downloadLink" style="display: none;"></a>
        <button class="sideButton" id="createNoteButton" tabindex="0"><img class="icon" title="Create a new note" src="Resources/plus-square.svg" draggable="false"></button>
        <button class="sideButton" id="uploadImageButton" tabindex="0"><img class="icon" src="Resources/upload.svg" draggable="false"></button>
        <button class="sideButton" id="saveButton" tabindex="0"><img class="icon" src="Resources/floppy.svg" draggable="false"></button>
        <button class="sideButton" id="loadButton" tabindex="0"><img class="icon" src="Resources/box-arrow-in-down.svg" draggable="false"></button>
        <button class="sideButton" id="clearButton" tabindex="0"><img class="icon" src="Resources/clipboard2-x.svg" draggable="false"></button>
        <button class="sideButton" id="cutButtonID" tabindex="0"><img class="icon" src="Resources/scissors.svg" draggable="false"></button>
    </div>
    <div id="viewport">
        <div id="zoomSpace">
            <div id="corkboard" class="corkdrag">
                <svg id="string"></svg>
            </div>
        </div>
    </div>
    <dialog id="modalOverlay" class="hidden">
        <span id="editNoteBox" role="dialog" aria-label="Edit note window" aria-modal="true">
            <div class="modalTextSection">
                <label class="modalTextLabel" for="modalTextInput">Edit Note Text</label>
                <textarea id="modalTextInput"></textarea>
            </div>
            <div class="modalColourSection">
                <label class="modalColourSelectorLabel" for="modalColourSelector">Select Note Colour</label>
                <div class="modalColourPicker" id="modalColourSelector"></div>
            </div>
            <div>
                <button id="cancelNoteEditButton">Cancel</button>
                <button id="applyNoteEditButton">Apply</button>
            </div>
        </span>
    </dialog>
</body>
</html>
